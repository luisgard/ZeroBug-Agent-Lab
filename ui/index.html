  .switch input { opacity: 0; width: 48px; height: 28px; position: absolute; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; pointer-events: none; transition: background .15s; }

  .switch input:checked + span { background: var(--brand); }

  .spinner { width: 18px; height: 18px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  dialog { border: 0; border-radius: var(--radius); padding: 0; max-width: 560px; width: calc(100% - 32px); background: var(--card); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(15,17,23,.45); }
  .dialog-body { padding: 24px; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: var(--soft); padding: 10px; border-radius: 8px; max-height: 240px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    const out = h("div", { "aria-live": "polite" }); const parts = []; const get = {};
    if (type === "gmail" && cat.googleOAuthConfigured) {
      body.replaceChildren(h("h2", {}, t("c_gmail")), h("p", { class: "muted" }, t("c_gmail_d")), h("div", { class: "actions" }, h("a", { class: "btn primary", href: "/api/oauth/google/start" }, t("c_google")), h("button", { type: "button", class: "btn", onclick: pickList }, t("back"))));
      return;
    }
    if (type === "gmail") {
      parts.push(h("p", { class: "muted small" }, t("c_google_off")));
      for (const [k, l, a] of [["clientId", "c_cid", {}], ["clientSecret", "c_secret", { type: "password" }], ["refreshToken", "c_rtoken", { type: "password" }]]) { const [lab, , i] = field("cf-" + k, t(l), a); parts.push(lab, i); get[k] = i; }
    } else if (type === "payapi") {
      for (const [k, l, a] of [["name", "c_name", { value: t("c_payapi_name") }], ["url", "c_payurl", { placeholder: "https://…/refunds?q={ref}" }], ["token", "c_token", { type: "password" }], ["items", "c_paylist", { value: "payments" }]]) { const [lab, , i] = field("cf-" + k, t(l), a); parts.push(lab, i); get[k] = i; }
    } else if (type === "inbox") {
      for (const [k, l, a] of [["name", "c_name", { value: "Buzón QA" }], ["url", "c_url", { placeholder: "https://…/inbox?q={ref}" }], ["token", "c_token", { type: "password" }], ["items", "c_list", { value: "emails" }]]) { const [lab, , i] = field("cf-" + k, t(l), a); parts.push(lab, i); get[k] = i; }
    } else {
      for (const [k, l, a] of [["apiKey", "c_key", { type: "password", placeholder: "rk_test_…" }]]) { const [lab, , i] = field("cf-" + k, t(l), a); parts.push(lab, i); get[k] = i; }
    }
    const saveBtn = h("button", { type: "button", class: "btn primary", onclick: async () => {
      saveBtn.disabled = true; out.replaceChildren(h("div", { class: "notice neutral", style: "display:flex;gap:10px;align-items:center" }, h("span", { class: "spinner" }), t("c_saving")));
      const v = (k) => get[k].value.trim();
      const reqBody = type === "gmail" ? { type: "gmail", clientId: v("clientId"), clientSecret: v("clientSecret"), refreshToken: v("refreshToken") }
        : type === "stripe" ? { type: "stripe_test", apiKey: v("apiKey") }
        : type === "payapi" ? { type: "http_json", name: v("name") || t("c_payapi_name"), kind: "payment", url: v("url"), itemsPath: v("items") || undefined, fields: { id: "id", amount: "amount", currency: "currency", status: "status", ref: "ref", date: "date" }, ...(v("token") ? { headerName: "Authorization", headerValue: `Bearer ${v("token")}`, healthUrl: v("url").split("?")[0].replace(/\/[^/]*$/, "/health") } : {}) }
        : { type: "http_json", name: v("name") || "Buzón QA", kind: "email", url: v("url"), itemsPath: v("items") || undefined, fields: { id: "id", to: "to", from: "from", subject: "subject", body: "body", date: "date" }, ...(v("token") ? { headerName: "Authorization", headerValue: `Bearer ${v("token")}`, healthUrl: v("url").split("?")[0].replace(/\/[^/]*$/, "/health") } : {}) };
      try {
        const c = await call("POST", "/api/connections", reqBody);
        if (c.status.state === "VERIFIED") {
          out.replaceChildren(h("div", { class: "notice ok" }, "✓ ", c.name));
          setTimeout(async () => { close(); if (S.view === "wizard" && S.step === 3) await proposeTests(null, null); else render(); }, 700);
        } else { out.replaceChildren(h("div", { class: "notice bad" }, c.status.detail)); saveBtn.disabled = false; }
      } catch (e) { out.replaceChildren(h("div", { class: "notice bad" }, e.message)); saveBtn.disabled = false; }
    } }, t("c_save"));
    body.replaceChildren(h("h2", {}, t(type === "gmail" ? "c_gmail" : type === "stripe" ? "c_stripe" : type === "payapi" ? "c_payapi" : "c_inbox")), ...parts, out,
      h("div", { class: "actions" }, h("button", { type: "button", class: "btn", onclick: pickList }, "← ", t("back")), h("span", { class: "spacer" }), saveBtn));
  };
  pickList();
  dlg.showModal();
}
$("#dlg").addEventListener("click", (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });

// ---------------------------------------------------------------- history
async function viewHistory(m) {
  const card = h("section", { class: "card" }, h("h1", {}, t("h_title")));
  m.append(card);
  let runs; try { runs = await call("GET", "/api/runs"); } catch (e) { card.append(h("div", { class: "notice bad" }, e.message)); return; }
  if (!runs.length) { card.append(h("p", { class: "muted" }, t("h_empty"))); return; }
  const cls = { PASS: "ok", FAIL: "bad", INCONCLUSIVE: "info", ERROR: "warn" };
  card.append(h("div", { style: "overflow-x:auto" }, h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, t("h_when")), h("th", {}, t("h_test")), h("th", {}, t("h_agent")), h("th", {}, t("h_res")))),
    h("tbody", {}, ...runs.map((r) => h("tr", {}, h("td", { class: "small" }, h("a", { href: `/run/${r.runId}`, onclick: (e) => { e.preventDefault(); S.view = "run"; S.runDetail = r.runId; history.pushState({}, "", `/run/${r.runId}`); render(); } }, new Date(r.startedAt).toLocaleString(lang))),
      h("td", {}, r.scenarioId), h("td", { class: "small" }, r.agent.label), h("td", {}, h("span", { class: "pill " + cls[r.verdict] }, t("v_" + r.verdict)))))))));
}

// ---------------------------------------------------------------- boot
function route() {
  const run = /^\/run\/([0-9a-f-]{36})$/.exec(location.pathname);
  if (run) { S.view = "run"; S.runDetail = run[1]; }
  else if (location.pathname === "/connections") S.view = "connections";
  else S.view = "wizard";
  render();
}
window.addEventListener("popstate", route);
paintChrome();
route();
call("GET", "/api/meta").then((m) => { S.meta = m; if (S.view === "wizard" && S.step === 1 && agentType().needsKey) render(); }).catch(() => {});
</script>
