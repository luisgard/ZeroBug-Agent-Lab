<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZeroBug Agent Labs</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2b313a; --text:#e6edf3; --muted:#8b949e; --pass:#2ea043; --fail:#f85149; --err:#d29922; --inc:#a371f7; --accent:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; gap:24px; align-items:baseline; flex-wrap:wrap; }
  header h1 { margin:0; font-size:20px; } header .tag { color:var(--muted); }
  nav { display:flex; gap:4px; padding:8px 24px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav button, .tabs button { background:none; border:1px solid transparent; color:var(--muted); padding:6px 12px; border-radius:6px; cursor:pointer; font:inherit; }
  nav button.on, .tabs button.on { color:var(--text); border-color:var(--line); background:var(--panel); }
  main { padding:20px 24px; max-width:1300px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; } @media (max-width:900px){ .grid2{grid-template-columns:1fr;} }
  input, textarea, select { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; }
  label { display:block; color:var(--muted); font-size:13px; margin:10px 0 4px; }
  button.primary { background:var(--accent); color:#04111f; border:0; padding:8px 14px; border-radius:6px; font-weight:600; cursor:pointer; margin-top:12px; }
  button.primary:disabled { opacity:.4; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; font-size:14px; } td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:700; }
  .PASS,.pass,.VERIFIED,.READY{ background:#12351d; color:var(--pass);} .FAIL,.fail,.BLOCKED{ background:#3d1517; color:var(--fail);} .ERROR,.error{ background:#3a2c0b; color:var(--err);} .INCONCLUSIVE,.inconclusive,.unsupported,.UNSUPPORTED,.REVIEW{ background:#2a1f45; color:var(--inc);} .DECLARED{ background:#1c2a3d; color:var(--accent);} .running{background:#1c2a3d;color:var(--accent);}
  .banner { font-size:22px; font-weight:800; padding:14px 16px; border-radius:8px; margin-bottom:16px; }
  .muted { color:var(--muted); } .small { font-size:13px; } .err { color:var(--fail); }
  .step { border-left:3px solid var(--line); padding:4px 10px; margin:6px 0; font-family: ui-monospace, monospace; font-size:13px; white-space:pre-wrap; word-break:break-word; }
  .step.call{border-color:var(--accent);} .step.okr{border-color:var(--pass);} .step.bad{border-color:var(--fail);} .step.msg{border-color:var(--inc); font-family:inherit; font-size:14px;} .step.eff{border-color:var(--err);}
  pre { white-space:pre-wrap; word-break:break-word; font-size:12px; background:var(--bg); padding:8px; border-radius:6px; max-height:300px; overflow:auto; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; } .row > * { flex:1; min-width:160px; }
  .scen { border:1px solid var(--line); border-radius:8px; padding:10px; margin:8px 0; } .scen input{ width:auto; margin-right:8px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header><h1>ZeroBug Agent Labs</h1><span class="tag" id="tagline">Agents report. ZeroBug proves.</span><span id="meta" class="muted small"></span><span id="lang" role="group" aria-label="Language" style="display:flex;gap:4px;margin-left:auto"></span></header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
const $ = (sel) => document.querySelector(sel);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c))); // text only: agent output is untrusted
  return el;
}
const badge = (t, cls = t) => h("span", { class: `badge ${cls}` }, t);
async function call(method, path, body) {
  const res = await fetch(path, { method, headers: { "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({ error: "Bad response" }));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
const state = { meta: null, agent: null, agentLabel: "none selected", scenarios: [], connectTab: "samples", lastRunIds: [] };
const views = { connect: viewConnect, connections: viewConnections, scenarios: viewScenarios, runs: viewRuns, gate: viewGate };
// ---------------------------------------------------------------- i18n (ES / EN)
const I18N = {
  en: {
    tagline: "Agents report. ZeroBug proves.", nav_connect: "1 · Connect agent", nav_connections: "2 · Connections", nav_scenarios: "3 · Scenarios & run", nav_runs: "4 · Runs", nav_gate: "5 · Release gate",
    c_title: "Connections", c_sub: "Connect the apps where your agent leaves a trace. ZeroBug only READS through these connections: it never sends, applies, buys or deletes anything.",

    c_save: "Save and test", c_cancel: "Cancel", c_saving: "Testing access…", c_saved: "Connected and tested", c_saved_bad: "Saved, but the test failed",
    f_name: "Name", f_key: "Stripe TEST key (rk_test_… or sk_test_…)", f_kind: "What it returns", f_url: "URL (must contain {ref})", f_items: "Where the list is (e.g. data.items)",
    f_fields: "Field mapping", f_hname: "Auth header name (optional)", f_hval: "Auth header value (stored encrypted)", f_health: "Health-check URL (optional, proves access)",

    k_email: "Emails", k_order: "Orders", k_payment: "Payments", cat_all: "All", cat_email: "Email", cat_jobs: "Jobs", cat_stores: "Stores", cat_payments: "Payments", cat_messaging: "Messaging", cat_calendar: "Calendar", cat_advanced: "Advanced",
    name_http_json: "Your own API", name_mcp_http: "MCP server", name_activepieces: "Activepieces catalog", name_test_inbox: "Test inbox service",
    verified: "VERIFIED", unavailable: "UNAVAILABLE", confirm_delete: "Delete this connection? Scenarios that use it will become INCONCLUSIVE.", flash_ok: "Connected:", flash_err: "Could not connect:",
  },
  es: {
    tagline: "Los agentes dicen. ZeroBug comprueba.", nav_connect: "1 · Conectar agente", nav_connections: "2 · Conexiones", nav_scenarios: "3 · Escenarios y ejecución", nav_runs: "4 · Corridas", nav_gate: "5 · Release gate",
    c_title: "Conexiones", c_sub: "Conecta las apps donde tu agente deja huella. ZeroBug solo LEE con estas conexiones: nunca envía, postula, compra ni borra nada.",
    c_yours: "Tus conexiones", c_none: "Aún no hay conexiones. Agrega una del catálogo de abajo.", c_use: "Úsala en escenarios como", c_test: "Probar", c_delete: "Eliminar", c_checked: "revisada",
    c_file: "Configurada por el operador (zerobug.sources.json)", c_catalog: "Catálogo", c_soon: "Próximamente", c_connect: "Conectar", c_google: "Entrar con Google",

    c_manual: "Conectar con un token existente", c_via_gmail: "Funciona con tu conexión de Gmail.", c_has_gmail: "✓ Listo (Gmail conectado)", c_need_gmail: "Conecta Gmail primero",
    c_custom: "Crear conector propio", c_custom_sub: "¿Tu sistema no está? Dile a ZeroBug dónde mirar. Solo lectura y se prueba antes de usarse.",
    c_save: "Guardar y probar", c_cancel: "Cancelar", c_saving: "Probando acceso…", c_saved: "Conectado y probado", c_saved_bad: "Guardado, pero la prueba falló",
    f_name: "Nombre", f_key: "Llave de PRUEBA de Stripe (rk_test_… o sk_test_…)", f_kind: "Qué devuelve", f_url: "URL (debe contener {ref})", f_items: "Dónde está la lista (ej. data.items)",
    f_fields: "Mapeo de campos", f_hname: "Nombre del encabezado de acceso (opcional)", f_hval: "Valor del encabezado (se guarda cifrado)", f_health: "URL para probar acceso (opcional)",
    f_mcpurl: "URL del servidor MCP", f_auth: "Encabezado Authorization (se guarda cifrado)", f_tool: "Herramienta de lectura a usar", f_args: "Argumentos (JSON; {ref} se reemplaza)",

    k_email: "Correos", k_order: "Pedidos", k_payment: "Pagos", cat_all: "Todas", cat_email: "Correo", cat_jobs: "Empleo", cat_stores: "Tiendas", cat_payments: "Pagos", cat_messaging: "Mensajería", cat_calendar: "Calendario", cat_advanced: "Avanzado",
    name_http_json: "Tu propia API", name_mcp_http: "Servidor MCP", name_activepieces: "Catálogo Activepieces", name_test_inbox: "Servicio de buzón de pruebas", name_stripe_test: "Stripe (modo prueba)",
    verified: "VERIFICADA", unavailable: "NO DISPONIBLE", confirm_delete: "¿Eliminar esta conexión? Los escenarios que la usen quedarán INCONCLUSIVE.", flash_ok: "Conectado:", flash_err: "No se pudo conectar:",

};
let lang = (() => { try { const saved = localStorage.getItem("zb-lang"); if (saved === "es" || saved === "en") return saved; } catch {} return (navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en"; })();
const tr = (k) => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;
function setLang(l) { lang = l; try { localStorage.setItem("zb-lang", l); } catch {} paintChrome(); render(state.view || "connect", state.viewArg); }
function paintChrome() {
  $("#tagline").textContent = tr("tagline");
  const box = $("#lang"); box.replaceChildren();
  for (const l of ["es", "en"]) box.append(h("button", { class: lang === l ? "on" : "", "aria-pressed": String(lang === l), onclick: () => setLang(l), style: "min-width:44px;min-height:36px;border:1px solid var(--line);border-radius:6px;background:" + (lang === l ? "var(--panel)" : "none") + ";color:var(--text);cursor:pointer" }, l.toUpperCase()));
}
function nav(active) {
  const n = $("#nav"); n.replaceChildren();
  for (const k of ["connect", "connections", "scenarios", "runs", "gate"])
    n.append(h("button", { class: active === k ? "on" : "", onclick: () => go(k) }, tr("nav_" + k)));
}
function go(view, arg) { history.pushState({}, "", view === "run" ? `/run/${arg}` : view === "connections" ? "/connections" : "/"); render(view, arg); }
function render(view, arg) { state.view = view; state.viewArg = arg; nav(view); const m = $("#main"); m.replaceChildren(); (view === "run" ? viewRun : views[view])(m, arg); }

// ---------------------------------------------------------------- connections
async function viewConnections(m) {
  const flash = h("div");
  const q = new URLSearchParams(location.search);
  if (q.get("connected")) flash.append(h("p", { class: "panel", style: "border-color:var(--pass)" }, badge("VERIFIED"), " ", tr("flash_ok"), " ", h("code", {}, q.get("connected"))));
  if (q.get("error")) flash.append(h("p", { class: "panel err" }, tr("flash_err"), " ", q.get("error")));
  const yours = h("div", { class: "panel" });
  const catalogBox = h("div");
  m.append(h("div", { class: "panel" }, h("h2", { style: "margin:0 0 6px" }, tr("c_title")), h("p", { class: "muted", style: "margin:0" }, tr("c_sub"))), flash, yours, catalogBox);

  let data, cat;
  try { [data, cat] = await Promise.all([call("GET", "/api/connections"), call("GET", "/api/connections/catalog")]); }
  catch (e) { yours.replaceChildren(h("p", { class: "err" }, e.message)); return; }
  const hasGmail = data.connections.some((c) => c.type === "gmail" && c.status.state === "VERIFIED");

  // ---- your connections
  const kinds = (p) => p.map((k) => tr("k_" + k)).join(", ");
  const rows = data.connections.map((c) => {
    const st = h("div", { class: "small" }, badge(c.status.state === "VERIFIED" ? tr("verified") : tr("unavailable"), c.status.state === "VERIFIED" ? "VERIFIED" : "FAIL"), " ", h("span", { class: "muted" }, `${c.status.detail} · ${tr("c_checked")} ${new Date(c.status.checkedAt).toLocaleString(lang)}`));
    const testBtn = h("button", { class: "primary", style: "margin:0", onclick: async () => { testBtn.disabled = true; try { await call("POST", `/api/connections/${c.id}/test`); } catch (e) { alert(e.message); } render("connections"); } }, tr("c_test"));
    const delBtn = h("button", { style: "min-height:36px;border:1px solid var(--line);border-radius:6px;background:none;color:var(--fail);cursor:pointer;padding:6px 12px", onclick: async () => { if (!confirm(tr("confirm_delete"))) return; await call("DELETE", `/api/connections/${c.id}`); render("connections"); } }, tr("c_delete"));
    return h("tr", {}, h("td", {}, h("b", {}, c.name), h("div", { class: "small muted" }, kinds(c.provides))), h("td", { class: "small" }, tr("c_use"), " ", h("code", {}, `source: ${c.slug}`)), h("td", {}, st), h("td", {}, h("div", { style: "display:flex;gap:8px" }, testBtn, delBtn)));
  });
  const fileRows = data.fileSources.map((n) => h("tr", {}, h("td", {}, h("b", {}, n)), h("td", { class: "small" }, tr("c_use"), " ", h("code", {}, `source: ${n}`)), h("td", { class: "small muted" }, tr("c_file")), h("td", {})));
  yours.append(h("h3", { style: "margin-top:0" }, tr("c_yours")), rows.length || fileRows.length ? h("div", { style: "overflow-x:auto" }, h("table", {}, ...rows, ...fileRows)) : h("p", { class: "muted" }, tr("c_none")));

  // ---- catalog
  const cats = ["all", "email", "jobs", "stores", "payments", "messaging", "calendar", "advanced"];
  state.connCat = state.connCat || "all";
  const chips = h("div", { class: "tabs", style: "display:flex;flex-wrap:wrap;gap:4px" }, ...cats.map((k) => h("button", { class: state.connCat === k ? "on" : "", onclick: () => { state.connCat = k; render("connections"); } }, tr("cat_" + k))));
  const grid = h("div", { style: "display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px" });
  const formBox = h("div");
  for (const e of cat.entries.filter((x) => state.connCat === "all" || x.category === state.connCat)) {
    const card = h("div", { class: "panel", style: "margin:0;display:flex;flex-direction:column;gap:8px" },
      h("div", { style: "display:flex;justify-content:space-between;gap:8px" }, h("b", {}, tr("name_" + e.type) === "name_" + e.type ? e.name : tr("name_" + e.type)), h("span", { class: "small muted" }, tr("cat_" + e.category))),
      h("div", { class: "small" }, e.reads[lang] || e.reads.en),
      e.note ? h("div", { class: "small", style: "color:var(--err)" }, e.note[lang] || e.note.en) : "");
    if (e.status === "coming_soon") card.append(badge(tr("c_soon").toUpperCase(), "UNSUPPORTED"));
    else if (e.auth === "oauth_google") {
      if (cat.googleOAuthConfigured) card.append(h("a", { class: "primary", href: "/api/oauth/google/start", style: "background:var(--accent);color:#04111f;padding:8px 14px;border-radius:6px;font-weight:600;text-decoration:none;align-self:flex-start" }, tr("c_google")));
      else card.append(h("div", { class: "small muted" }, tr("c_google_off")));

    } else if (e.auth === "none") card.append(h("div", { class: "small" }, hasGmail ? badge(tr("c_has_gmail"), "VERIFIED") : tr("c_need_gmail")));
    else card.append(h("button", { class: "primary", style: "margin:0;align-self:flex-start", onclick: () => openForm(e.type, formBox) }, e.category === "advanced" ? tr("c_custom") : tr("c_connect")));
    grid.append(card);
  }
  catalogBox.append(h("div", { class: "panel" }, h("h3", { style: "margin-top:0" }, tr("c_catalog")), chips, formBox, grid));
}

let fieldSeq = 0;
function field(labelKey, input) { const id = `f-${++fieldSeq}`; input.id = id; return h("div", {}, h("label", { for: id }, tr(labelKey)), input); }
function openForm(type, box) {
  const inp = (attrs = {}) => h("input", attrs);
  const out = h("div", { class: "small", role: "status" });
  const els = {};
  const parts = [];
  if (type === "gmail") {
    els.clientId = inp(); els.clientSecret = inp({ type: "password" }); els.refreshToken = inp({ type: "password" });
    parts.push(field("f_cid", els.clientId), field("f_csecret", els.clientSecret), field("f_rtoken", els.refreshToken));
  } else if (type === "stripe_test") {
    els.name = inp({ value: "Stripe test" }); els.apiKey = inp({ type: "password", placeholder: "rk_test_…" });
    parts.push(field("f_name", els.name), field("f_key", els.apiKey));
  } else if (type === "http_json") {
    els.name = inp({ placeholder: "My store orders" });
    els.kind = h("select", {}, ...["order", "payment", "email"].map((k) => h("option", { value: k }, tr("k_" + k))));
    els.url = inp({ placeholder: "https://staging.example.com/api/orders?note={ref}" }); els.itemsPath = inp({ placeholder: "orders" });
    els.fields = h("textarea", { rows: 3 }, '{"id":"id","product":"product_name","quantity":"qty","total":"total","status":"status","ref":"note"}');
    els.headerName = inp({ placeholder: "Authorization" }); els.headerValue = inp({ type: "password", placeholder: "Bearer …" }); els.healthUrl = inp({ placeholder: "https://staging.example.com/api/health" });
    parts.push(field("f_name", els.name), field("f_kind", els.kind), field("f_url", els.url), field("f_items", els.itemsPath), field("f_fieldsjson", els.fields), field("f_hname", els.headerName), field("f_hval", els.headerValue), field("f_health", els.healthUrl));
  } else if (type === "mcp_http") {
    els.name = inp({ placeholder: "Outlook via MCP" }); els.url = inp({ placeholder: "https://mcp.example.com/mcp" }); els.authorization = inp({ type: "password", placeholder: "Bearer …" });
    els.kind = h("select", {}, ...["email", "order", "payment"].map((k) => h("option", { value: k }, tr("k_" + k))));
    els.tool = inp({ placeholder: "search_messages" }); els.args = h("textarea", { rows: 2 }, '{"query":"{ref}"}');
    els.mode = h("select", {}, h("option", { value: "text" }, "text"), h("option", { value: "json" }, "json"));
    els.itemsPath = inp({ placeholder: "results" }); els.fields = h("textarea", { rows: 2 }, '{"id":"id","to":"to","subject":"subject","body":"body"}');
    parts.push(field("f_name", els.name), field("f_mcpurl", els.url), field("f_auth", els.authorization), field("f_kind", els.kind), field("f_tool", els.tool), field("f_args", els.args), field("f_parse", els.mode), field("f_items", els.itemsPath), field("f_fieldsjson", els.fields));
  }
  const v = (k) => (els[k] ? els[k].value.trim() : "");
  const json = (k) => { try { return JSON.parse(v(k) || "{}"); } catch { throw new Error(`${tr("f_fieldsjson")}: invalid JSON`); } };
  const save = h("button", { class: "primary", onclick: async () => {
    out.className = "small"; out.textContent = tr("c_saving"); save.disabled = true;
    try {
      let body;
      if (type === "gmail") body = { type, clientId: v("clientId"), clientSecret: v("clientSecret"), refreshToken: v("refreshToken") };
      else if (type === "stripe_test") body = { type, name: v("name"), apiKey: v("apiKey") };
      else if (type === "http_json") body = { type, name: v("name"), kind: v("kind"), url: v("url"), fields: json("fields"), ...(v("itemsPath") ? { itemsPath: v("itemsPath") } : {}), ...(v("headerName") ? { headerName: v("headerName"), headerValue: v("headerValue") } : {}), ...(v("healthUrl") ? { healthUrl: v("healthUrl") } : {}) };
      else body = { type, name: v("name"), url: v("url"), kind: v("kind"), tool: v("tool"), args: json("args"), parse: v("mode") === "json" ? { mode: "json", fields: json("fields"), ...(v("itemsPath") ? { itemsPath: v("itemsPath") } : {}) } : { mode: "text" }, ...(v("authorization") ? { authorization: v("authorization") } : {}) };
      const c = await call("POST", "/api/connections", body);
      out.replaceChildren(badge(c.status.state === "VERIFIED" ? tr("verified") : tr("unavailable"), c.status.state === "VERIFIED" ? "VERIFIED" : "FAIL"), " ", c.status.state === "VERIFIED" ? tr("c_saved") : tr("c_saved_bad"), ": ", c.status.detail, " · ", h("code", {}, `source: ${c.slug}`));
      setTimeout(() => render("connections"), c.status.state === "VERIFIED" ? 1200 : 3500);
    } catch (e) { out.className = "small err"; out.textContent = e.message; save.disabled = false; }

// ---------------------------------------------------------------- run view

  const others = state.lastRunIds.length > 1 ? h("div", { class: "panel small" }, "Runs in this batch: ", ...state.lastRunIds.map((id, i) => [h("a", { href: `/run/${id}`, onclick: (e) => { e.preventDefault(); go("run", id); } }, `#${i + 1}`), " "])) : null;
  m.append(head, others || "", h("div", { class: "grid2" }, left, right), checks);

    let d; try { d = await call("GET", `/api/runs/${runId}`); } catch (e) { head.replaceChildren(h("p", { class: "err" }, e.message)); return; }

        e.type === "tool_result" ? h("div", { class: `step ${e.ok ? "okr" : "bad"}` }, e.ok ? `← ok ${JSON.stringify(e.result).slice(0, 300)}` : `← error ${e.error}`) :
        e.type === "message" ? h("div", { class: "step msg" }, h("div", { class: "small muted" }, "Final message (a claim, not proof)"), e.text) :
        h("div", { class: "step bad" }, `${e.category}: ${e.reason}`)));

      r && !r.worldSnapshot ? h("p", { class: "muted" }, `World state not observable (black-box). Verifiers: ${r.verifiers.join(", ")}`) : "",
      r && r.worldSnapshot ? h("div", {}, h("label", {}, "Cart"), h("pre", {}, JSON.stringify(r.worldSnapshot.cart, null, 1)), h("label", {}, "Orders"), h("pre", {}, JSON.stringify(r.worldSnapshot.orders, null, 1)), h("label", {}, "Outbox (synthetic)"), h("pre", {}, JSON.stringify(r.worldSnapshot.outbox.map((x) => ({ to: x.to, subject: x.subject })), null, 1))) : "",
      h("label", {}, "World effects (journal)"), ...(effects.length ? effects.map((e) => h("div", { class: "step eff" }, `${e.kind} ${JSON.stringify(e.data)}`)) : [h("div", { class: "muted small" }, "none")]),
      r && r.faultsFired.length ? h("p", { class: "small" }, "Faults fired: ", r.faultsFired.join("; ")) : "",
      r && r.judgeAnswers ? h("div", {}, h("label", {}, `Judge (${r.judge.name}) — interpretations, not proof`), ...r.judgeAnswers.map((a) => h("div", { class: "small" }, `${a.name}: ${a.type === "predicate" ? `p=${a.probability}` : a.type === "score" ? `${a.label} (${a.score})` : a.type === "choice" ? `${a.choice} (${a.confidence})` : "refused"}`))) : "");
    if (!r) return checks.replaceChildren();
    const ev = Object.fromEntries(r.evidence.map((e) => [e.id, e]));
    checks.replaceChildren(h("h3", {}, "Checks and evidence"), h("table", {}, h("tr", {}, h("th", {}, "Check"), h("th", {}, "Status"), h("th", {}, "Reason"), h("th", {}, "Evidence")),
      r.checks.map((c) => h("tr", {}, h("td", {}, c.checkId, c.critical ? h("div", { class: "small muted" }, "critical") : "", c.informational ? h("div", { class: "small muted" }, "informational") : "", c.goal ? h("div", { class: "small muted" }, "goal") : ""), h("td", {}, badge(c.status.toUpperCase(), c.status)), h("td", {}, c.reason, h("div", { class: "small muted" }, `via ${c.verifier}`)),
