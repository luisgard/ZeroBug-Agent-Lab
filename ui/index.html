<title>ZeroBug</title>
<style>

  }

  main { max-width: 860px; margin: 0 auto; padding: 8px 16px 64px; }

  .steps .cur button { color: var(--ink); border-color: var(--brand); font-weight: 600; }
  .steps .cur .n { background: var(--brand); color: var(--brand-ink); }
  .steps .done .n { background: var(--ok-soft); color: var(--ok); }

  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -.02em; }
  h2 { font-size: 18px; margin: 0 0 8px; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
  @media (max-width: 640px) { .choices { grid-template-columns: 1fr; } }
  .choice { text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 18px; cursor: pointer; font: inherit; color: var(--ink); display: flex; gap: 14px; align-items: flex-start; }
  .choice[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
  .choice .ic { width: 40px; height: 40px; border-radius: 10px; background: var(--soft); display: grid; place-items: center; flex: none; color: var(--brand); }
  .choice b { display: block; margin-bottom: 2px; }
  .choice span { color: var(--muted); font-size: 14px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  input, textarea, select { width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: transparent; }
  textarea { resize: vertical; }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--muted); font-size: 14px; min-height: 32px; display: flex; align-items: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-weight: 600; border-radius: 12px; padding: 12px 20px; min-height: 48px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .actions { display: flex; gap: 10px; align-items: center; margin-top: 20px; flex-wrap: wrap; }
  .actions .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .ok { background: var(--ok-soft); color: var(--ok); } .bad { background: var(--bad-soft); color: var(--bad); }
  .warn { background: var(--warn-soft); color: var(--warn); } .info { background: var(--info-soft); color: var(--info); } .neutral { background: var(--soft); color: var(--muted); }
  .notice { border-radius: 12px; padding: 14px 16px; font-size: 15px; margin-top: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; min-height: 40px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .test { border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; background: var(--card); }
  .test.off { opacity: .6; }
  .test-head { display: flex; gap: 14px; align-items: flex-start; }
  .test-head .grow { flex: 1; min-width: 0; }
  .test-title { font-weight: 700; font-size: 17px; margin: 0 0 6px; }
  .switch { position: relative; width: 48px; height: 28px; flex: none; margin-top: 2px; }
  .switch input { opacity: 0; width: 48px; height: 28px; position: absolute; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; pointer-events: none; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; width: 22px; height: 22px; top: 3px; left: 3px; background: #fff; border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + span { background: var(--brand); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 2px; }
  .switch input:disabled + span { opacity: .5; }
  ul.clean { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 6px; }
  ul.clean li { display: flex; gap: 8px; align-items: flex-start; font-size: 15px; }
  .mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; flex: none; margin-top: 1px; }
  .big { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .bar { height: 10px; background: var(--soft); border-radius: 999px; overflow: hidden; display: flex; }
  .bar span { display: block; height: 100%; }
  .runs { display: flex; flex-direction: column; gap: 8px; }
  .run { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; font: inherit; color: var(--ink); text-align: left; width: 100%; min-height: 56px; }

  .run .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 720px) { .cols { grid-template-columns: 1fr; } }
  .bubble { background: var(--soft); border-radius: 12px; padding: 12px 14px; white-space: pre-wrap; word-break: break-word; font-size: 15px; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .spinner { width: 18px; height: 18px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  dialog { border: 0; border-radius: var(--radius); padding: 0; max-width: 560px; width: calc(100% - 32px); background: var(--card); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(15,17,23,.45); }
  .dialog-body { padding: 24px; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: var(--soft); padding: 10px; border-radius: 8px; max-height: 240px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
